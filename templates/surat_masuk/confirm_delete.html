{% extends 'base.html' %}
{% block title %}Hapus Surat Masuk{% endblock %}

{% block content %}
<div class="card card-body">
    <h5>Konfirmasi Hapus</h5>
    <p>Apakah Anda yakin ingin menghapus surat <strong>{{ object.nomor_surat }}</strong> ({{ object.perihal }})?</p>
    <p class="text-danger small">Tindakan ini tidak dapat dibatalkan.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Ya, Hapus</button>
        <a href="{% url 'surat_masuk:list' %}" class="btn btn-outline-secondary">Batal</a>
    </form>
</div>
{% endblock %}
